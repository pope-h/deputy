# Deputy — standalone deployment.
#
# Deliberately its OWN stack, not a service inside plague-celo's compose. Deputy
# reaches Zombie Plague through the same public API and public contract any
# third-party agent would use, so it needs no private network path to that
# backend — and coupling the two deployments would quietly make the "an outside
# agent can play here" claim untrue of its own reference implementation.
#
# On the Lighthouse VPS this lives at /opt/deputy, alongside /opt/plague.

services:
  deputy:
    build: .
    container_name: deputy
    restart: unless-stopped

    # An explicit environment map, NOT env_file. The sibling plague stack learned
    # this the hard way: with env_file, a var present in .env but absent from the
    # code's expectations is silently ignored and the container quietly runs on a
    # default. Naming each one here means a missing value is visible.
    environment:
      # ── Identity ──
      AGENT_NAME: Deputy
      AGENT_PRIVATE_KEY: ${AGENT_PRIVATE_KEY:?AGENT_PRIVATE_KEY is required}
      AGENT_ID: ${AGENT_ID:-9811}
      AGENT_SOURCE_URL: https://github.com/pope-h/deputy

      # ── Chain ──
      NETWORK: mainnet
      CELO_RPC_URL: ${CELO_RPC_URL:-https://forno.celo.org}
      CELO_RPC_FALLBACK_URLS: ${CELO_RPC_FALLBACK_URLS:-https://celo.drpc.org}
      # Refuse to start work below this native balance. One full game costs
      # ~0.55 CELO, dominated by the ZK role commitment.
      MIN_GAS_WEI: ${MIN_GAS_WEI:-500000000000000000}
      ATTRIBUTION_TAG: ${ATTRIBUTION_TAG:-}

      # ── Reasoning ──
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-claude-opus-5}
      LLM_TIMEOUT_MS: ${LLM_TIMEOUT_MS:-8000}

      # ── Capability: zplague ──
      ZPLAGUE_CONTRACT: "0xe157fD2564246Afa41cfAFaDA01a9A6f3e082710"
      ZPLAGUE_STAKE_TOKEN: "0x765DE816845861e75A25fCA122bb6898B8B1282a"
      ZPLAGUE_API: ${ZPLAGUE_API:-https://api.zplague.xyz}
      ZPLAGUE_MAX_STAKE_WEI: ${ZPLAGUE_MAX_STAKE_WEI:-10000000000000000}
      ZPLAGUE_HOST_WHEN_EMPTY: ${ZPLAGUE_HOST_WHEN_EMPTY:-true}
      ZPLAGUE_HOST_STAKE_WEI: ${ZPLAGUE_HOST_STAKE_WEI:-10000000000000000}
      ZPLAGUE_HOST_MAX_PLAYERS: ${ZPLAGUE_HOST_MAX_PLAYERS:-4}
      ZPLAGUE_MAX_GAMES_PER_DAY: ${ZPLAGUE_MAX_GAMES_PER_DAY:-4}
      ZPLAGUE_DAILY_LOSS_CAP_WEI: ${ZPLAGUE_DAILY_LOSS_CAP_WEI:-50000000000000000}
      ZPLAGUE_VOTE_TIMEOUT_MS: ${ZPLAGUE_VOTE_TIMEOUT_MS:-25000}
      ZPLAGUE_PROOF_CACHE: /app/data/role-proof.json
      ZPLAGUE_STATE: /app/data/zplague-state.json

      # ── Capability: askbots ──
      # Must be the env var here: the container has no ~/.config/askbots, which
      # is where the key is read from on a developer machine.
      ASKBOTS_API_KEY: ${ASKBOTS_API_KEY:-}
      ASKBOTS_API: ${ASKBOTS_API:-https://www.askbots.ai/api}
      # A review earns $0.10 and costs ~23k in / 4k out tokens. Opus 5 would
      # spend ~$0.22 to earn $0.10; Haiku 4.5 costs ~$0.04.
      ASKBOTS_MODEL: ${ASKBOTS_MODEL:-claude-haiku-4-5-20251001}
      ASKBOTS_MAX_PER_DAY: ${ASKBOTS_MAX_PER_DAY:-10}
      ASKBOTS_MIN_INTERVAL_MS: ${ASKBOTS_MIN_INTERVAL_MS:-600000}

    volumes:
      - deputydata:/app/data

    # The agent is chatty and long-lived; without a cap its logs are the thing
    # that eventually fills the disk on a small VPS.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  deputydata:
